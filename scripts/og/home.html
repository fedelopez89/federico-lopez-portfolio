<!doctype html>
<!--
  Source for public/images/og-image.png (1200x630).
  Regenerate with: node scripts/og/render-og.mjs
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../../public/fonts/inter-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        background: #0f172a;
        overflow: hidden;
      }
      .frame {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 88px 96px;
        font-family: 'Inter', sans-serif;
        color: #f8fafc;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(
            to right,
            rgba(148, 163, 184, 0.09) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(148, 163, 184, 0.09) 1px,
            transparent 1px
          );
        background-size: 48px 48px;
        background-position: -1px -1px;
        -webkit-mask-image: radial-gradient(
          ellipse 85% 90% at 70% 45%,
          #000 35%,
          transparent 100%
        );
        mask-image: radial-gradient(
          ellipse 85% 90% at 70% 45%,
          #000 35%,
          transparent 100%
        );
      }
      .glow {
        position: absolute;
        width: 620px;
        height: 620px;
        right: -40px;
        top: -60px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(59, 130, 246, 0.26) 0%,
          rgba(139, 92, 246, 0.12) 38%,
          transparent 70%
        );
      }
      .window {
        position: absolute;
        width: 336px;
        height: 240px;
        right: 144px;
        top: 96px;
        background-image:
          linear-gradient(
            to right,
            rgba(96, 165, 250, 0.45) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(96, 165, 250, 0.45) 1px,
            transparent 1px
          );
        background-size: 48px 48px;
        background-position: -1px -1px;
        -webkit-mask-image: radial-gradient(
          circle at 50% 50%,
          #000 20%,
          transparent 72%
        );
        mask-image: radial-gradient(
          circle at 50% 50%,
          #000 20%,
          transparent 72%
        );
      }
      .content {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 18px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 20px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #cbd5e1;
      }
      .eyebrow::before {
        content: '';
        width: 48px;
        height: 2px;
        background: #3b82f6;
      }
      h1 {
        margin-top: 28px;
        font-size: 112px;
        font-weight: 680;
        line-height: 0.98;
        letter-spacing: -0.04em;
      }
      .tagline {
        margin-top: 28px;
        max-width: 760px;
        font-size: 30px;
        line-height: 1.4;
        color: #cbd5e1;
      }
      .proof {
        display: flex;
        margin-top: auto;
        padding: 0;
        list-style: none;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 17px;
        color: #94a3b8;
      }
      .proof li {
        white-space: nowrap;
      }
      .proof li + li {
        margin-left: 18px;
        padding-left: 18px;
        border-left: 1px solid #334155;
      }
      .domain {
        position: absolute;
        right: 0;
        top: 2px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 19px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="grid"></div>
      <div class="glow"></div>
      <div class="window"></div>
      <div class="content">
        <p class="eyebrow">Senior Frontend Engineer</p>
        <h1>Federico López</h1>
        <p class="tagline">
          I build fast, accessible interfaces for products people actually use.
        </p>
        <ul class="proof">
          <li>16+ years in IT</li>
          <li>7+ years in React / Next.js</li>
          <li>REAL Evals · featured in The New York Times</li>
        </ul>
        <span class="domain">federicoglopez.dev</span>
      </div>
    </div>
  </body>
</html>
