<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- "F_": an F with a text cursor. Drawn on the 16px grid so every edge is
       crisp in a browser tab. Colors invert on dark tab bars. -->
  <style>
    .tile { fill: #0f172a; }
    .glyph { fill: #f8fafc; }
    .cursor { fill: #3b82f6; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f8fafc; }
      .glyph { fill: #0f172a; }
      .cursor { fill: #2563eb; }
    }
  </style>
  <rect class="tile" width="16" height="16" rx="3.5" />
  <g class="glyph" shape-rendering="crispEdges">
    <rect x="4" y="3" width="2" height="10" />
    <rect x="4" y="3" width="7" height="2" />
    <rect x="4" y="7" width="5" height="2" />
  </g>
  <rect class="cursor" x="8" y="11" width="5" height="2" shape-rendering="crispEdges" />
</svg>
